apiVersion: batch/v1
kind: Job
metadata:
  name: feast-sync
  labels:
    app: feast-sync
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: feast-sync
    spec:
      restartPolicy: Never

      initContainers:
        - name: init-minio-feast-buckets
          image: minio/mc:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              mc alias set myminio http://minio-service:9000 minioadmin minioadmin && \
              mc mb myminio/feast-registry || true && \
              mc mb myminio/feast-offline || true

      containers:
        - name: feast-sync-worker
          image: romangoldur/feast-repo:v1
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install feast==0.31.1 boto3==1.34.84 botocore==1.34.84 && \
              cd /feast/repo && \
              feast apply && \
              feast materialize-incremental $(date -u +"%Y-%m-%dT%H:%M:%SZ" -d "-7 days")
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "minioadmin"
            - name: AWS_SECRET_ACCESS_KEY
              value: "minioadmin"
            - name: FEAST_S3_ENDPOINT_URL
              value: "http://minio-service:9000"
          volumeMounts:
            - name: feast-repo
              mountPath: /feast/repo

      volumes:
        - name: feast-repo
          persistentVolumeClaim:
            claimName: feast-repo-pvc
